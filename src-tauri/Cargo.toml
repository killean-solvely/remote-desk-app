[package]
name = "remote-desk"
version = "0.6.0"
edition = "2021"
default-run = "remote-desk"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
rpassword = "7"
zeroize = "1"
fs2 = "0.4"
unicode-normalization = "0.1"
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1", features = ["time", "net", "sync", "rt"] }
tauri-plugin-updater = "2"
tauri-plugin-opener = "2.7.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Graphics_Gdi"] }
