[package]
name = "remote-desk"
version = "0.6.1"
edition = "2021"
default-run = "remote-desk"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
rpassword = "7"
zeroize = "1"
fs2 = "0.4"
unicode-normalization = "0.1"
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1", features = ["time", "net", "sync", "rt"] }
tauri-plugin-updater = "2"
tauri-plugin-opener = "2.7.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Graphics_Gdi"] }
windows = { version = "0.62", features = ["Foundation", "Data_Xml_Dom", "UI_Notifications", "Win32_Foundation", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSError", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
